name: Windows CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python tests/test_core.py
      - name: Generate test media
        run: python tests/make_test_media.py
      - name: End-to-end acceptance
        run: python tests/acceptance_test.py
      - name: Build GUI EXE
        run: cmd /c build_exe.bat
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: DJI_DLogM_BatchGrader-Windows
          path: dist/DJI_DLogM_BatchGrader
