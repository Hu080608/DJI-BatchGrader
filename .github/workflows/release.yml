name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches version files
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $versionFile = (Get-Content VERSION -Raw).Trim()
          if ($versionFile -ne $version) { throw "VERSION ($versionFile) does not match tag ($tag)" }
          python -c "from dlog_grader import __version__; import sys; assert __version__ == sys.argv[1], (__version__, sys.argv[1])" $version
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python tests/test_core.py
      - name: Generate test media
        run: python tests/make_test_media.py
      - name: End-to-end acceptance
        run: python tests/acceptance_test.py
      - name: Build GUI EXE
        run: cmd /c build_exe.bat
      - name: Package release assets
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools/package_release.ps1 -Version "${{ github.ref_name }}"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DJI D-Log M Batch Grader ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            release/*.zip
            release/*.zip.sha256
          fail_on_unmatched_files: true
